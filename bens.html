<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bens e Património | Controlo Financeiro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <div class="page-heading">
            <div>
                <h2>Bens Patrimoniais</h2>
                <p>Cadastre e acompanhe automóveis, imóveis e bens de valor do casal.</p>
            </div>
            <div class="toolbar-actions">
                <button type="button" onclick="abrirModalNovoBem()">+ Novo Bem</button>
            </div>
        </div>

        <section class="form-card">
            <div class="section-title">
                <div><h2>Os Seus Bens</h2><p>Património próprio e compartilhado.</p></div>
            </div>
            <div class="tabela-container">
                <table class="tabela">
                    <thead>
                        <tr>
                            <th>Nome / Identificação</th>
                            <th>Tipo</th>
                            <th>Estado / Financiamento</th>
                            <th>Valor</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaBensGeral"></tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Modal Novo Bem -->
    <div id="modalNovoBem" class="modal-overlay" style="display: none;">
        <div class="modal-box" style="max-width: 500px; width: 95%;">
            <h3>Cadastrar Bem Patrimonial</h3>
            <p>Informe os detalhes do património.</p>
            
            <form id="formBemModal" onsubmit="salvarBemModal(event)">
                <div class="form-group">
                    <label for="nomeBem">Nome do Bem</label>
                    <input type="text" id="nomeBem" placeholder="Ex.: Ford Ka 2018 ou Casa Praia" required>
                </div>
                
                <div class="form-grid-2" style="margin-top: 12px;">
                    <div class="form-group">
                        <label for="tipoBem">Tipo</label>
                        <select id="tipoBem" onchange="atualizarCampoEspecificoBem()">
                            <option value="veiculo">Veículo</option>
                            <option value="imovel">Imóvel</option>
                            <option value="outro">Outro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="valorBem">Valor de Mercado (R$)</label>
                        <input type="number" step="0.01" min="0" id="valorBem" placeholder="45000,00" required>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 12px;" id="grupoCampoEspecifico">
                    <label id="labelCampoEspecifico" for="campoEspecifico">Placa ou Final da Placa</label>
                    <input type="text" id="campoEspecifico" placeholder="Ex.: ABC-1234 ou 1234" required>
                </div>

                <div class="form-group" style="margin-top: 12px;">
                    <label for="statusBem">Estado do Bem</label>
                    <select id="statusBem">
                        <option value="quitado">Quitado</option>
                        <option value="financiado">Financiado / Parcelado</option>
                    </select>
                </div>

                <div class="form-group" style="margin-top: 12px;">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" id="bemCompartilhado" style="width: 18px; height: 18px;"> Compartilhar património com o parceiro(a)
                    </label>
                </div>

                <div class="modal-buttons" style="margin-top: 20px;">
                    <button type="button" class="btn-secundario" onclick="fecharModalNovoBem()">Cancelar</button>
                    <button type="submit">Salvar bem</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            injetarHeader();
            const autenticado = await verificarAutenticacao();
            if (autenticado) {
                carregarTabelaBensGeral();
            }
        });

        function abrirModalNovoBem() {
            document.getElementById('modalNovoBem').style.display = 'flex';
            atualizarCampoEspecificoBem();
        }

        function fecharModalNovoBem() {
            document.getElementById('modalNovoBem').style.display = 'none';
            document.getElementById('formBemModal').reset();
        }

        function atualizarCampoEspecificoBem() {
            const tipo = document.getElementById('tipoBem').value;
            const label = document.getElementById('labelCampoEspecifico');
            const input = document.getElementById('campoEspecifico');
            const grupo = document.getElementById('grupoCampoEspecifico');

            if (tipo === 'veiculo') {
                grupo.style.display = 'block';
                label.textContent = 'Placa ou Final da Placa';
                input.placeholder = 'Ex.: ABC-1234 ou 1234';
                input.required = true;
            } else if (tipo === 'imovel') {
                grupo.style.display = 'block';
                label.textContent = 'CEP ou Final do CEP';
                input.placeholder = 'Ex.: 13000-000 ou 000';
                input.required = true;
            } else {
                grupo.style.display = 'none';
                input.required = false;
            }
        }

        async function salvarBemModal(event) {
            event.preventDefault();
            const nome = document.getElementById('nomeBem').value.trim();
            const tipo = document.getElementById('tipoBem').value;
            // Correção: Protegido contra 'NaN'
            const valor = numeroSeguro(document.getElementById('valorBem').value);
            const campoEspecifico = document.getElementById('campoEspecifico').value.trim();
            const statusBem = document.getElementById('statusBem').value;
            const compartilhado = document.getElementById('bemCompartilhado').checked;

            if (!nome || valor < 0) {
                await mostrarAlertaModal('Preencha os campos corretamente.');
                return;
            }

            if ((tipo === 'veiculo' || tipo === 'imovel') && !campoEspecifico) {
                await mostrarAlertaModal(tipo === 'veiculo' ? 'Informe a placa ou final da placa.' : 'Informe o CEP ou final do CEP.');
                return;
            }

            mostrarLoading("A salvar bem...");
            const dados = obterDados();
            const usuarioId = Number(localStorage.getItem('usuarioLogado'));

            const bemId = dados.bens.reduce((m, b) => Math.max(m, Number(b.id) || 0), 0) + 1;
            dados.bens.push({
                id: bemId,
                usuarioId,
                nome,
                tipo,
                valor: Number(valor.toFixed(2)),
                identificadorEspecifico: campoEspecifico,
                statusBem,
                compartilhado,
                ativo: true,
                createdAt: new Date().toISOString()
            });

            registrarLogInterno(dados, "CADASTRO BEM", `Bem cadastrado: ${nome} (${tipo})`, { entidade: 'bem', entidadeId: bemId });
            await salvarDados(dados);

            esconderLoading();
            fecharModalNovoBem();
            carregarTabelaBensGeral();

            if (statusBem === 'financiado') {
                const criarFinanciamento = await mostrarConfirmacaoModal("Bem cadastrado! Como indicou que está financiado/parcelado, deseja criar o contrato de financiamento agora?");
                if (criarFinanciamento) {
                    window.location.href = 'financiamentos.html';
                }
            } else {
                await mostrarAlertaModal("Bem cadastrado com sucesso!");
            }
        }

        function carregarTabelaBensGeral() {
            const dados = obterDados();
            const tbody = document.getElementById('tabelaBensGeral');
            if (!tbody) return;
            tbody.innerHTML = '';

            const usuarioId = Number(localStorage.getItem('usuarioLogado'));
            const usuario = dados.usuarios.find(u => Number(u.id) === usuarioId) || {};

            const bens = (dados.bens || []).filter(b => {
                if (b.ativo === false) return false;
                const eSeu = Number(b.usuarioId) === usuarioId || !b.usuarioId;
                const eCompartilhado = b.compartilhado && usuario.parceiroId;
                return eSeu || eCompartilhado;
            });

            if (bens.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center;">Nenhum bem cadastrado.</td></tr>`;
                return;
            }

            bens.forEach(b => {
                const financiamentoVinculado = (dados.financiamentos || []).find(f => Number(f.bemId) === Number(b.id) && f.ativo !== false);

                let statusHtml = '';
                if (financiamentoVinculado) {
                    statusHtml = `<a href="detalhes-financiamento.html?id=${financiamentoVinculado.id}" class="text-link">Financiado (${financiamentoVinculado.nome})</a>`;
                } else if (b.statusBem === 'financiado') {
                    statusHtml = `<a href="financiamentos.html" class="text-link" style="color: var(--warning);">Financiado (Sem contrato atrelado)</a>`;
                } else {
                    statusHtml = `<span class="status-badge status-pago">Quitado</span>`;
                }

                const infoExtra = b.identificadorEspecifico ? `<br><small style="color: var(--text-muted);">${b.tipo === 'veiculo' ? 'Placa:' : 'CEP:'} ${b.identificadorEspecifico}</small>` : '';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${b.nome}</strong> ${infoExtra} ${b.compartilhado ? '<span style="font-size:0.7rem; background:var(--primary-soft); color:var(--primary); padding:2px 6px; border-radius:4px;">Compartilhado</span>' : ''}</td>
                    <td>${b.tipo.toUpperCase()}</td>
                    <td>${statusHtml}</td>
                    <td>R$ ${Number(b.valor || 0).toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
                    <td>
                        <button onclick="excluirBemGeral(${b.id})" class="btn-acao-icone excluir" title="Excluir"><img src="imagens/excluir.png" alt="Excluir"></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function excluirBemGeral(id) {
            if (!await verificarSenhaAdmin("excluir bem")) return;

            const dadosCheck = obterDados();
            const financiamentoVinculado = (dadosCheck.financiamentos || []).find(f => Number(f.bemId) === Number(id) && f.ativo !== false);
            if (financiamentoVinculado) {
                await mostrarAlertaModal(`Este bem está vinculado ao financiamento "${financiamentoVinculado.nome}". Exclua ou desvincule o financiamento antes de excluir o bem.`);
                return;
            }

            const confirmar = await mostrarConfirmacaoModal("Deseja realmente excluir este bem?");
            if (!confirmar) return;

            mostrarLoading("A excluir...");
            const dados = obterDados();
            dados.bens = dados.bens.filter(b => String(b.id) !== String(id));
            await salvarDados(dados);
            esconderLoading();
            carregarTabelaBensGeral();
        }
    </script>
</body>
</html>
