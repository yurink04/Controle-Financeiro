<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar lançamento | Controle Financeiro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <div class="page-heading">
            <div>
                <h2>Editar lançamento</h2>
                <p>Alterações ficam registradas na auditoria e exigem uma justificativa.</p>
            </div>
            <a href="#" onclick="voltarOrigem(event)" class="text-link">← Voltar</a>
        </div>

        <section class="form-card">
            <form id="formEditarLancamento" onsubmit="salvarEdicaoLancamento(event)" novalidate>
                <input type="hidden" id="editId">
                <div class="form-grid-2">
                    <div class="form-group">
                        <label for="editDescricao">Descrição</label>
                        <input type="text" id="editDescricao" maxlength="120" required>
                    </div>
                    <div class="form-group">
                        <label for="editTipo">Tipo</label>
                        <select id="editTipo" onchange="tratarMudancaTipoEdicao()">
                            <option value="saida">Saída</option>
                            <option value="entrada">Entrada</option>
                        </select>
                    </div>
                </div>
                <div class="form-grid-2">
                    <div class="form-group">
                        <label for="editCategoria">Categoria</label>
                        <select id="editCategoria" required></select>
                    </div>
                    <div class="form-group">
                        <label for="editFormaPagamento">Forma de pagamento</label>
                        <select id="editFormaPagamento" onchange="tratarMudancaFormaEdicao()">
                            <option value="DINHEIRO">Dinheiro / Pix / Débito</option>
                            <option value="BOLETO">Boleto / Conta</option>
                            <option value="FIXO">Conta fixa</option>
                            <option value="CARTAO">Cartão de crédito</option>
                        </select>
                    </div>
                </div>

                <!-- Bloco de Cartão na Edição -->
                <div id="blocoEditCartao" class="form-group" style="display:none; margin-top:12px;">
                    <label for="editCartao">Cartão de crédito</label>
                    <select id="editCartao"></select>
                </div>

                <div id="blocoServicoEssencial" class="form-group" style="margin-top:12px;">
                    <label for="editServicoEssencial">Despesa essencial?</label>
                    <select id="editServicoEssencial">
                        <option value="nao">Não</option>
                        <option value="sim">Sim</option>
                    </select>
                </div>
                
                <div id="blocoEditEscopo" class="form-group" style="margin-top:12px;">
                    <label for="editEscopo">Escopo do gasto</label>
                    <select id="editEscopo">
                        <option value="casal">Casal / Casa</option>
                        <option value="individual">Individual</option>
                    </select>
                </div>

                <div class="form-grid-2" style="margin-top:12px;">
                    <div class="form-group">
                        <label for="editValor">Valor (R$)</label>
                        <input type="number" step="0.01" min="0.01" id="editValor" required>
                    </div>
                    <div class="form-group">
                        <label for="editVencimento">Data de vencimento / recebimento</label>
                        <input type="date" id="editVencimento" required>
                    </div>
                </div>
                <div class="form-group" style="margin-top:12px;">
                    <label for="editObservacao">Observação</label>
                    <input type="text" id="editObservacao" maxlength="250">
                </div>
                <div class="btn-row" style="margin-top:18px;">
                    <button type="submit">Salvar alterações</button>
                    <button type="button" class="btn-secondary" onclick="voltarOrigem(event)">Cancelar</button>
                </div>
            </form>
        </section>
    </main>

   <script src="script.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const lancamentoId = urlParams.get('id') || '';
        const returnUrlInformada = urlParams.get('returnUrl') || '';
        const destinosRetornoPermitidos = new Set([
            'dashboard.html', 'central-pagamentos.html', 'lancamentos.html', 'relatorios.html', 'cartoes.html', 'financiamentos.html'
        ]);
        const returnUrl = destinosRetornoPermitidos.has(returnUrlInformada) ? returnUrlInformada : '';
        let lancamentoAtualEdicao = null;

        document.addEventListener('DOMContentLoaded', async () => {
            injetarHeader();
            const autenticado = await verificarAutenticacao();
            if (autenticado) carregarFormulario();
        });

        function voltarOrigem(event) {
            if (event) event.preventDefault();
            if (returnUrl) {
                window.location.href = returnUrl;
            } else {
                window.location.href = 'dashboard.html';
            }
        }

        function popularSelectCartoesEdicao(dados) {
            const selectCartao = document.getElementById('editCartao');
            if (!selectCartao) return;
            const usuarioAtualId = Number(obterUsuarioAtualId(dados));
            const cartoesUsuario = filtrarDadosPorPermissao(dados.cartoes || [], dados, 'casal')
                .filter(c => c.ativo !== false && !c.isBeneficio && Number(c.usuarioId) === usuarioAtualId);

            selectCartao.replaceChildren();
            const placeholder = document.createElement('option');
            placeholder.value = '';
            placeholder.textContent = cartoesUsuario.length ? 'Selecione um cartão' : 'Nenhum cartão de crédito ativo';
            selectCartao.appendChild(placeholder);
            cartoesUsuario.forEach(c => {
                const opt = document.createElement('option');
                opt.value = String(c.id);
                opt.textContent = c.nome;
                selectCartao.appendChild(opt);
            });
        }

        function popularCategoriasEdicao(tipo, categoriaPreferida = null) {
            const dados = obterDados();
            const selectCat = document.getElementById('editCategoria');
            if (!selectCat) return;
            const categorias = (dados.categorias || []).filter(c => c.tipo === tipo)
                .sort((a, b) => normalizarTexto(a.nome).localeCompare(normalizarTexto(b.nome), 'pt-BR'));
            selectCat.replaceChildren();
            categorias.forEach(c => {
                const option = document.createElement('option');
                option.value = String(c.id);
                option.textContent = c.nome;
                selectCat.appendChild(option);
            });
            if (!categorias.length) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = 'Nenhuma categoria deste tipo cadastrada';
                selectCat.appendChild(opt);
                selectCat.disabled = true;
                return;
            }
            selectCat.disabled = false;
            const preferidaExiste = categorias.some(c => String(c.id) === String(categoriaPreferida));
            selectCat.value = preferidaExiste ? String(categoriaPreferida) : String(categorias[0].id);
        }

        function carregarFormulario() {
            const dados = obterDados();
            lancamentoAtualEdicao = (dados.lancamentos || []).find(l => String(l.id) === String(lancamentoId));
            if (!lancamentoAtualEdicao) {
                mostrarAlertaModal('Lançamento não encontrado.').then(() => voltarOrigem());
                return;
            }
            if (!usuarioPodeAlterarLancamento(lancamentoAtualEdicao, dados)) {
                mostrarAlertaModal('Você não tem permissão para visualizar ou editar este lançamento.').then(() => voltarOrigem());
                lancamentoAtualEdicao = null;
                return;
            }

            const lanc = lancamentoAtualEdicao;
            document.getElementById('editId').value = String(lanc.id);
            document.getElementById('editDescricao').value = lanc.descricao || '';
            document.getElementById('editTipo').value = lanc.tipo === 'entrada' ? 'entrada' : 'saida';
            document.getElementById('editFormaPagamento').value = lanc.formaPagamento || 'BOLETO';
            document.getElementById('editValor').value = Number(lanc.valor || 0);
            document.getElementById('editObservacao').value = lanc.observacao || '';
            document.getElementById('editVencimento').value = lanc.vencimento || dataLocalYYYYMMDD();
            document.getElementById('editServicoEssencial').value = lanc.servicoEssencial || 'nao';
            document.getElementById('editEscopo').value = lanc.escopo || 'casal';
            popularCategoriasEdicao(lanc.tipo === 'entrada' ? 'entrada' : 'saida', lanc.categoriaId);
            popularSelectCartoesEdicao(dados);
            if (lanc.cartaoId) document.getElementById('editCartao').value = String(lanc.cartaoId);
            tratarMudancaTipoEdicao(false);
            tratarMudancaFormaEdicao();
        }

        function tratarMudancaTipoEdicao(atualizarCategorias = true) {
            const tipoEl = document.getElementById('editTipo');
            const tipo = tipoEl?.value === 'entrada' ? 'entrada' : 'saida';
            if (atualizarCategorias) {
                const categoriaAtual = document.getElementById('editCategoria')?.value;
                popularCategoriasEdicao(tipo, categoriaAtual);
            }
            const entrada = tipo === 'entrada';
            const blocoServ = document.getElementById('blocoServicoEssencial');
            if (blocoServ) blocoServ.style.display = entrada ? 'none' : 'block';
            const blocoEsc = document.getElementById('blocoEditEscopo');
            if (blocoEsc) blocoEsc.style.display = entrada ? 'none' : 'block';
            if (entrada) document.getElementById('blocoEditCartao').style.display = 'none';
            else tratarMudancaFormaEdicao();
        }

        function tratarMudancaFormaEdicao() {
            const forma = document.getElementById('editFormaPagamento')?.value || 'BOLETO';
            const tipo = document.getElementById('editTipo')?.value || 'saida';
            const blocoCart = document.getElementById('blocoEditCartao');
            if (blocoCart) blocoCart.style.display = (tipo === 'saida' && forma === 'CARTAO') ? 'block' : 'none';
        }

        async function salvarEdicaoLancamento(event) {
            event.preventDefault();
            const dados = obterDados();
            // Rebusca a versão atual antes de salvar; não usa uma referência capturada antes da autenticação/sync.
            const lanc = (dados.lancamentos || []).find(l => String(l.id) === String(lancamentoId));
            if (!lanc || !usuarioPodeAlterarLancamento(lanc, dados)) {
                await mostrarAlertaModal('O lançamento não existe mais ou você não tem permissão para editá-lo.');
                return;
            }
            const descricao = document.getElementById('editDescricao')?.value?.trim() || '';
            const tipo = document.getElementById('editTipo')?.value || 'saida';
            const formaPagamento = document.getElementById('editFormaPagamento')?.value || 'BOLETO';
            const valor = numeroSeguro(document.getElementById('editValor')?.value, NaN);
            const categoriaId = document.getElementById('editCategoria')?.value || '';
            const cartaoId = (tipo === 'saida' && formaPagamento === 'CARTAO') ? (document.getElementById('editCartao')?.value || null) : null;

            if (!descricao || !Number.isFinite(valor) || valor <= 0) {
                await mostrarAlertaModal('Informe uma descrição e um valor maior que zero.');
                return;
            }
            if (!(dados.categorias || []).some(c => String(c.id) === String(categoriaId) && c.tipo === tipo)) {
                await mostrarAlertaModal('Selecione uma categoria válida para o tipo de lançamento escolhido.');
                return;
            }
            if (tipo === 'saida' && formaPagamento === 'CARTAO') {
                const cartao = (dados.cartoes || []).find(c => String(c.id) === String(cartaoId) && c.ativo !== false && !c.isBeneficio && Number(c.usuarioId) === Number(obterUsuarioAtualId(dados)));
                if (!cartao) {
                    await mostrarAlertaModal('Selecione um cartão de crédito ativo e autorizado.');
                    return;
                }
            }
            const vencimento = document.getElementById('editVencimento')?.value || '';
            const dataValida = criarDataLocal(vencimento);
            if (!dataValida) {
                await mostrarAlertaModal('Informe uma data de vencimento válida.');
                return;
            }

            const ok = await atualizarLancamentoNoBanco(lancamentoId, {
                descricao, tipo, categoriaId, formaPagamento, valor,
                observacao: document.getElementById('editObservacao')?.value?.trim() || '',
                vencimento,
                servicoEssencial: tipo === 'saida' ? (document.getElementById('editServicoEssencial')?.value || 'nao') : 'nao',
                escopo: tipo === 'saida' ? (document.getElementById('editEscopo')?.value || 'casal') : 'casal',
                cartaoId,
                dataCompra: lanc.dataCompra || null,
                bemId: tipo === 'saida' ? (lanc.bemId || null) : null
            });
            if (ok) voltarOrigem();
        }
    </script>
</body>
</html>
