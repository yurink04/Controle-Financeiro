<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar lançamento | Controle Financeiro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <div class="page-heading">
            <div>
                <h2>Editar lançamento</h2>
                <p>Alterações ficam registradas na auditoria e exigem uma justificativa.</p>
            </div>
            <a href="#" onclick="voltarOrigem(event)" class="text-link">← Voltar</a>
        </div>

        <section class="form-card">
            <form id="formEditarLancamento" onsubmit="salvarEdicaoLancamento(event)" novalidate>
                <input type="hidden" id="editId">
                <div class="form-grid-2">
                    <div class="form-group">
                        <label for="editDescricao">Descrição</label>
                        <input type="text" id="editDescricao" maxlength="120" required>
                    </div>
                    <div class="form-group">
                        <label for="editTipo">Tipo</label>
                        <select id="editTipo" onchange="tratarMudancaTipoEdicao()">
                            <option value="saida">Saída</option>
                            <option value="entrada">Entrada</option>
                        </select>
                    </div>
                </div>
                <div class="form-grid-2">
                    <div class="form-group">
                        <label for="editCategoria">Categoria</label>
                        <select id="editCategoria" required></select>
                    </div>
                    <div class="form-group">
                        <label for="editFormaPagamento">Forma de pagamento</label>
                        <select id="editFormaPagamento" onchange="tratarMudancaFormaEdicao()">
                            <option value="DINHEIRO">Dinheiro / Pix / Débito</option>
                            <option value="BOLETO">Boleto / Conta</option>
                            <option value="FIXO">Conta fixa</option>
                            <option value="CARTAO">Cartão de crédito</option>
                        </select>
                    </div>
                </div>

                <!-- Bloco de Cartão na Edição -->
                <div id="blocoEditCartao" class="form-group" style="display:none; margin-top:12px;">
                    <label for="editCartao">Cartão de crédito</label>
                    <select id="editCartao"></select>
                </div>

                <div id="blocoServicoEssencial" class="form-group" style="margin-top:12px;">
                    <label for="editServicoEssencial">Despesa essencial?</label>
                    <select id="editServicoEssencial">
                        <option value="nao">Não</option>
                        <option value="sim">Sim</option>
                    </select>
                </div>
                
                <div id="blocoEditEscopo" class="form-group" style="margin-top:12px;">
                    <label for="editEscopo">Escopo do gasto</label>
                    <select id="editEscopo">
                        <option value="casal">Casal / Casa</option>
                        <option value="individual">Individual</option>
                    </select>
                </div>

                <div class="form-grid-2" style="margin-top:12px;">
                    <div class="form-group">
                        <label for="editValor">Valor (R$)</label>
                        <input type="number" step="0.01" min="0.01" id="editValor" required>
                    </div>
                    <div class="form-group">
                        <label for="editVencimento">Data de vencimento / recebimento</label>
                        <input type="date" id="editVencimento" required>
                    </div>
                </div>
                <div class="form-group" style="margin-top:12px;">
                    <label for="editObservacao">Observação</label>
                    <input type="text" id="editObservacao" maxlength="250">
                </div>
                <div class="btn-row" style="margin-top:18px;">
                    <button type="submit">Salvar alterações</button>
                    <button type="button" class="btn-secondary" onclick="voltarOrigem(event)">Cancelar</button>
                </div>
            </form>
        </section>
    </main>

   <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            injetarHeader();
            const autenticado = await verificarAutenticacao();
            if (autenticado) {
                carregarFormulario();
            }
        });

        const urlParams = new URLSearchParams(window.location.search);
        const lancamentoId = Number(urlParams.get('id'));
        const returnUrl = urlParams.get('returnUrl');

        const dadosEdicao = obterDados();
        const lancamento = (dadosEdicao.lancamentos || []).find(l => Number(l.id) === lancamentoId);

        function voltarOrigem(event) {
            if (event) event.preventDefault();
            if (returnUrl) {
                window.location.href = returnUrl;
            } else {
                history.back();
            }
        }

        function popularSelectCartoesEdicao() {
            const selectCartao = document.getElementById('editCartao');
            if (!selectCartao) return;
            const usuarioAtualId = Number(obterUsuarioAtualId(dadosEdicao));
            const cartoesUsuario = (dadosEdicao.cartoes || []).filter(c => c.ativo !== false && Number(c.usuarioId) === usuarioAtualId);
            
            selectCartao.innerHTML = '';
            if (cartoesUsuario.length === 0) {
                selectCartao.innerHTML = '<option value="">Nenhum cartão ativo</option>';
                return;
            }
            cartoesUsuario.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = c.nome;
                selectCartao.appendChild(opt);
            });
        }

        function carregarFormulario() {
            if (!lancamento) {
                mostrarAlertaModal('Lançamento não encontrado.').then(() => voltarOrigem());
                return;
            }
            const selectCat = document.getElementById('editCategoria');
            if (selectCat) {
                selectCat.innerHTML = '';
                (dadosEdicao.categorias || []).forEach(c => {
                    const option = document.createElement('option');
                    option.value = c.id;
                    option.textContent = c.nome;
                    selectCat.appendChild(option);
                });
            }

            popularSelectCartoesEdicao();

            const elId = document.getElementById('editId');
            if (elId) elId.value = lancamento.id;
            const elDesc = document.getElementById('editDescricao');
            if (elDesc) elDesc.value = lancamento.descricao || '';
            const elTipo = document.getElementById('editTipo');
            if (elTipo) elTipo.value = lancamento.tipo || 'saida';
            if (selectCat) selectCat.value = lancamento.categoriaId || '';
            const elForma = document.getElementById('editFormaPagamento');
            if (elForma) elForma.value = lancamento.formaPagamento || 'BOLETO';
            
            if (lancamento.cartaoId) {
                const elCartao = document.getElementById('editCartao');
                if (elCartao) elCartao.value = lancamento.cartaoId;
            }

            const elValor = document.getElementById('editValor');
            if (elValor) elValor.value = lancamento.valor || 0;
            const elObs = document.getElementById('editObservacao');
            if (elObs) elObs.value = lancamento.observacao || '';
            const elVenc = document.getElementById('editVencimento');
            if (elVenc) elVenc.value = lancamento.vencimento || dataLocalYYYYMMDD();
            const elServEss = document.getElementById('editServicoEssencial');
            if (elServEss) elServEss.value = lancamento.servicoEssencial || 'nao';
            const elEscopo = document.getElementById('editEscopo');
            if (elEscopo) elEscopo.value = lancamento.escopo || 'casal';
            
            tratarMudancaTipoEdicao();
            tratarMudancaFormaEdicao();
        }

        function tratarMudancaTipoEdicao() {
            const tipoEl = document.getElementById('editTipo');
            const entrada = tipoEl ? tipoEl.value === 'entrada' : false;
            const blocoServ = document.getElementById('blocoServicoEssencial');
            if (blocoServ) blocoServ.style.display = entrada ? 'none' : 'block';
            const blocoEsc = document.getElementById('blocoEditEscopo');
            if (blocoEsc) blocoEsc.style.display = entrada ? 'none' : 'block';
            if (entrada) {
                const blocoCart = document.getElementById('blocoEditCartao');
                if (blocoCart) blocoCart.style.display = 'none';
            } else {
                tratarMudancaFormaEdicao();
            }
        }

        function tratarMudancaFormaEdicao() {
            const formaEl = document.getElementById('editFormaPagamento');
            const forma = formaEl ? formaEl.value : '';
            const tipoEl = document.getElementById('editTipo');
            const tipo = tipoEl ? tipoEl.value : 'saida';
            const blocoCart = document.getElementById('blocoEditCartao');
            if (blocoCart) {
                blocoCart.style.display = (tipo === 'saida' && forma === 'CARTAO') ? 'block' : 'none';
            }
        }

        async function salvarEdicaoLancamento(event) {
            event.preventDefault();
            if (!lancamento) return;
            const tipo = document.getElementById('editTipo')?.value || 'saida';
            const formaPagamento = document.getElementById('editFormaPagamento')?.value || 'BOLETO';
            const valor = numeroSeguro(document.getElementById('editValor')?.value);
            const cartaoId = (tipo === 'saida' && formaPagamento === 'CARTAO') ? (document.getElementById('editCartao')?.value || null) : null;

            if (!Number.isFinite(valor) || valor <= 0) {
                await mostrarAlertaModal('Informe um valor válido.');
                return;
            }

            if (tipo === 'saida' && formaPagamento === 'CARTAO' && !cartaoId) {
                await mostrarAlertaModal('Selecione um cartão de crédito válido.');
                return;
            }

            const ok = await atualizarLancamentoNoBanco(lancamentoId, {
                descricao: document.getElementById('editDescricao')?.value?.trim() || '',
                tipo,
                categoriaId: Number(document.getElementById('editCategoria')?.value) || 0,
                formaPagamento,
                valor,
                observacao: document.getElementById('editObservacao')?.value?.trim() || '',
                vencimento: document.getElementById('editVencimento')?.value || dataLocalYYYYMMDD(),
                servicoEssencial: tipo === 'saida' ? (document.getElementById('editServicoEssencial')?.value || 'nao') : 'nao',
                escopo: tipo === 'saida' ? (document.getElementById('editEscopo')?.value || 'casal') : 'casal',
                cartaoId: cartaoId ? Number(cartaoId) : null,
                dataCompra: lancamento.dataCompra || null,
                bemId: tipo === 'saida' ? (lancamento.bemId || null) : null
            });
            
            if (ok) {
                voltarOrigem();
            }
        }
    </script>
</body>
</html>
