<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro | Acesso</title>

    <link rel="stylesheet" href="style.css">
    <style>
        /* Tela de carregamento imersiva pós-login */
        #loginLoadingScreen {
            position: fixed;
            inset: 0;
            background: var(--bg-primary);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        #loginLoadingScreen.ativo {
            opacity: 1;
            pointer-events: auto;
        }
        .loading-profile-img {
            width: 108px;
            height: 108px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary);
            box-shadow: 0 16px 35px rgba(0,0,0,0.18);
            animation: pulseProfile 1.8s infinite ease-in-out;
            background: var(--surface-2);
        }
        @keyframes pulseProfile {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(139, 94, 60, 0.4); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 32px rgba(139, 94, 60, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(139, 94, 60, 0); }
        }
        .btn-voltar-usuario {
            background: none;
            border: none;
            color: var(--primary);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            padding: 0;
            margin-top: 4px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            text-decoration: underline;
            transition: opacity 0.2s;
        }
        .btn-voltar-usuario:hover {
            opacity: 0.8;
        }
        /* Transição de esmaecimento para os textos dinâmicos */
        .loading-fade-text {
            transition: opacity 0.35s ease-in-out;
            opacity: 1;
        }
        .loading-fade-text.esmaecendo {
            opacity: 0;
        }
        /* Barra de progresso da tela de carregamento */
        .loading-progress-bar-container {
            width: min(280px, 80vw);
            height: 6px;
            background: var(--surface-2);
            border-radius: 99px;
            overflow: hidden;
            border: 1px solid var(--border);
            margin-top: 18px;
        }
        .loading-progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            border-radius: 99px;
            transition: width 0.3s ease;
        }
        /* Durante a validação, use somente o GIF como indicador de carregamento.
           Desativa spinners/dots antigos criados por pseudo-elementos no CSS global. */
        .login-submit.loading::before,
        .login-submit.loading::after,
        .login-submit.loading *::before,
        .login-submit.loading *::after {
            content: none !important;
            display: none !important;
            visibility: hidden !important;
            animation: none !important;
            transform: none !important;
        }

        .login-submit.loading #loginSubmitLoadingGif { display: inline-block !important; }
    </style>
</head>

<body class="login-page">

    <!-- Abertura breve: o teste da API acontece ao mesmo tempo. -->
    <div class="login-intro" id="loginIntro" aria-hidden="true">
        <div class="login-intro-mark">R<span>$</span></div>
        <div class="login-intro-copy">
            <span>CONTROLE FINANCEIRO</span>
            <strong>Seu dia, mais leve.</strong>
        </div>
    </div>

    <div id="loginLoadingScreen" role="status" aria-live="polite">
        <div class="loading-profile-wrap">
            <img id="loadingUserAvatar" src="" alt="Perfil" class="loading-profile-img">
            <h3 id="loadingWelcomeText" class="loading-fade-text">Tudo certo com sua conta.</h3>
            <p id="loadingSubtext" class="loading-fade-text">Carregando seus dados...</p>
            <div class="loading-progress-bar-container">
                <div id="loadingProgressBarFill" class="loading-progress-bar-fill"></div>
            </div>
        </div>
    </div>

    <button type="button" class="login-theme-toggle" onclick="alternarTemaVisual(event)" title="Alternar tema">
        <img id="themeImage" class="theme-icon" src="imagens/modo_escuro.jpg" alt="Tema" style="width: 22px; height: 22px; border-radius: 50%; object-fit: contain;">
    </button>

    <main class="login-screen">

        <!-- PAINEL DIREITO -->
        <section class="login-form-panel" aria-label="Entrar no sistema">
            <div class="login-form-wrapper">
                <div class="login-brand-head">
                    <div class="login-mobile-logo">R<span>$</span></div>
                    <div class="login-brand-label">CONTROLE<br>FINANCEIRO</div>
                </div>

                <div class="login-heading" id="loginHeadingContainer">
                    <span class="login-eyebrow" id="loginEyebrowText">SEU ESPAÇO FINANCEIRO</span>
                    <h2 id="loginTitleText">Vamos entrar?</h2>
                    <p id="loginSubtitleText">Informe seu usuário para continuar.</p>
                </div>

                <form id="formLogin" onsubmit="realizarLogin(event)">

                    <!-- Campo usuário -->
                    <div class="login-field" id="blocoUsuarioContainer">
                        <label for="inputUsuario">Usuário</label>
                        <div class="login-select-wrapper" id="wrapperInputUsuario">
                            <span class="login-field-icon" id="iconeUsuarioPadrao">👤</span>
                            <input
                                type="text"
                                id="inputUsuario"
                                placeholder="Digite seu nome de usuário"
                                autocomplete="username"
                                required
                                class="login-input"
                            >
                        </div>
                    </div>

                    <!-- Campo de senha oculto inicialmente -->
                    <div class="login-field" id="blocoSenha" hidden>
                        <label for="inputSenha">Senha</label>
                        <div class="login-select-wrapper">
                            <span class="login-field-icon">🔒</span>
                            <input
                                type="password"
                                id="inputSenha"
                                placeholder="Digite sua senha"
                                autocomplete="current-password"
                                class="login-input"
                            >
                        </div>
                    </div>

                    <button type="submit" class="login-submit" id="loginSubmit">
                        <span class="login-submit-content">
                            <span class="login-submit-text">Continuar</span>
                            <span class="login-submit-arrow" id="loginSubmitArrow">→</span>
                            <img id="loginSubmitLoadingGif" src="imagens/loading1.gif" alt="" aria-hidden="true">
                        </span>
                    </button>

                </form>

                <div class="login-new-user" id="cardPrimeiroAcesso">
                    <span>É novo por aqui?</span>
                    <button type="button" id="btnPrimeiroAcesso" onclick="abrirModalPrimeiroAcesso()">Criar acesso <span aria-hidden="true">↗</span></button>
                </div>

                <div class="login-connection" id="loginConnection" data-state="loading" role="status" aria-live="polite">
                    <div class="login-connection-main">
                        <span class="login-connection-dot" aria-hidden="true"></span>
                        <span id="loginStatusText">Conectando ao servidor...</span>
                        <img class="login-status-gif" src="imagens/loading1.gif" alt="" aria-hidden="true">
                        <button type="button" class="login-retry" id="loginRetry" onclick="tentarConexaoNovamente()" hidden>Tentar novamente</button>
                    </div>
                    <div class="login-status-track" aria-hidden="true"><div class="login-status-fill"></div></div>
                </div>
            </div>
        </section>

    </main>

    <script src="script.js"></script>

    <script>
        let bancoInicializado = false;
        let loginOcupado = false;
        let usuarioSelecionadoParaLogin = null;
        const AVATAR_PADRAO = 'data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22%23a89586%22%3E%3Cpath%20d%3D%22M12%2012c2.21%200%204-1.79%204-4s-1.79-4-4-4-4%201.79-4%204%201.79%204%204%204zm0%202c-2.67%200-8%201.34-8%204v2h16v-2c0-2.66-5.33-4-8-4z%22%2F%3E%3C%2Fsvg%3E';

        function atualizarStatusLogin(mensagem, estado = 'loading') {
            const painel = document.getElementById('loginConnection');
            const texto = document.getElementById('loginStatusText');
            if (texto) texto.textContent = mensagem;
            if (painel) painel.dataset.state = estado;
            const retry = document.getElementById('loginRetry');
            if (retry) retry.hidden = estado !== 'error' || bancoInicializado;
        }

        async function testarConexaoInicial() {
            const botao = document.getElementById("loginSubmit");
            const retry = document.getElementById('loginRetry');
            if (retry) retry.disabled = true;
            if (botao) botao.disabled = true;
            bancoInicializado = false;
            atualizarStatusLogin('Verificando conexão...', 'loading');
            const controle = new AbortController();
            const limite = setTimeout(() => controle.abort(), 12000);
            try {
                const resposta = await fetch(`${API_URL}?action=ping&token=${encodeURIComponent(TOKEN_API)}`, {
                    cache: 'no-store', signal: controle.signal
                });
                if (!resposta.ok) throw new Error("A API não está acessível.");
                const json = await resposta.json();
                if (json.status !== 'sucesso') throw new Error(json.mensagem || 'Servidor não autorizado.');
                bancoInicializado = true;
                atualizarStatusLogin('Servidor conectado. Pronto para entrar.', 'success');
            } catch (erro) {
                console.warn('Conexão inicial indisponível:', erro);
                const mensagem = erro.name === 'AbortError'
                    ? 'Servidor demorou a responder.'
                    : erro.message === 'Acesso não autorizado'
                        ? 'Credencial da API não autorizada. Confira a configuração.'
                        : erro.message.includes('SENHA_')
                            ? 'Configuração do Apps Script pendente.'
                            : !navigator.onLine
                                ? 'Sem conexão com a internet.'
                                : 'Não foi possível alcançar o servidor.';
                atualizarStatusLogin(mensagem, 'error');
            } finally {
                clearTimeout(limite);
                if (botao) botao.disabled = !bancoInicializado;
                if (retry) retry.disabled = false;
            }
        }

        function tentarConexaoNovamente() { return testarConexaoInicial(); }

        document.addEventListener('DOMContentLoaded', () => {
            testarConexaoInicial();
            // A animação acolhe sem segurar a interação por causa da rede.
            const intro = document.getElementById('loginIntro');
            setTimeout(() => {
                intro?.classList.add('saindo');
                setTimeout(() => intro?.remove(), 550);
            }, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 950);
        });

        async function consultarLoginServidor(payload) {
            const controle = new AbortController();
            const limite = setTimeout(() => controle.abort(), 18000);
            try {
                const resposta = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'verificarCredenciaisLogin', token: TOKEN_API, ...payload }),
                    signal: controle.signal
                });
                if (!resposta.ok) throw new Error(`Servidor não respondeu (HTTP ${resposta.status}).`);
                const dados = await resposta.json();
                if (!dados || typeof dados.status !== 'string') throw new Error('Resposta inesperada da autenticação.');
                return dados;
            } finally {
                clearTimeout(limite);
            }
        }

        async function realizarLogin(event) {
            if (event) event.preventDefault();

            const inputUsuario = document.getElementById("inputUsuario");
            const inputSenha = document.getElementById("inputSenha");
            const blocoSenha = document.getElementById("blocoSenha");
            const botao = document.getElementById("loginSubmit");
            const textoBotao = document.querySelector(".login-submit-text");
            const spanTextoBotao = document.querySelector(".login-submit-text span:first-child") || textoBotao;
            const setaBotao = document.getElementById("loginSubmitArrow");
            const gifLoadingBotao = document.getElementById("loginSubmitLoadingGif");
            const wrapperInputUsuario = document.getElementById("wrapperInputUsuario");
            const iconeUsuarioPadrao = document.getElementById("iconeUsuarioPadrao");
            const loginEyebrowText = document.getElementById("loginEyebrowText");
            const loginTitleText = document.getElementById("loginTitleText");
            const loginSubtitleText = document.getElementById("loginSubtitleText");
            const cardPrimeiroAcesso = document.getElementById("cardPrimeiroAcesso");

            if (loginOcupado) return;
            if (!bancoInicializado) {
                atualizarStatusLogin('Conexão necessária para entrar. Tente novamente.', 'error');
                return;
            }

            loginOcupado = true;
            if (botao) botao.disabled = true;
            try {
                // PASSO 1: IDENTIFICAR O USUÁRIO DIGITADO E BUSCAR APENAS OS DADOS DELE NO SERVIDOR
                if (!usuarioSelecionadoParaLogin) {
                    const usuarioDigitado = inputUsuario.value.trim();
                    if (!usuarioDigitado) return;

                    if (botao) botao.classList.add("loading");
                    if (spanTextoBotao) spanTextoBotao.textContent = "Validando usuário...";
                    if (setaBotao) setaBotao.style.display = "none";
                    if (gifLoadingBotao) gifLoadingBotao.style.display = "inline-block";
                    atualizarStatusLogin('Procurando seu usuário...', 'loading');

                    const resultadoCheck = await consultarLoginServidor({
                        usuario: usuarioDigitado,
                        senhaHash: 'CHECK_APENAS_USUARIO'
                    });
                    if (resultadoCheck.status !== 'sucesso' || !resultadoCheck.usuario) {
                        atualizarStatusLogin(resultadoCheck.mensagem || 'Usuário não encontrado.', 'error');
                        await mostrarAlertaModal(resultadoCheck.mensagem || "Usuário não encontrado no sistema.");
                        if (botao) botao.classList.remove("loading");
                        if (spanTextoBotao) spanTextoBotao.textContent = "Continuar";
                        if (setaBotao) setaBotao.style.display = "inline";
                        if (gifLoadingBotao) gifLoadingBotao.style.display = "none";
                        return;
                    }

                    const usuarioUnico = resultadoCheck.usuario;
                    if (!usuarioUnico) {
                        await mostrarAlertaModal("Usuário não encontrado no sistema.");
                        if (botao) botao.classList.remove("loading");
                        if (spanTextoBotao) spanTextoBotao.textContent = "Continuar";
                        if (setaBotao) setaBotao.style.display = "inline";
                        if (gifLoadingBotao) gifLoadingBotao.style.display = "none";
                        return;
                    }

                    usuarioSelecionadoParaLogin = usuarioUnico;
                    inputUsuario.readOnly = true;
                    inputUsuario.style.opacity = '0.7';

                    if (iconeUsuarioPadrao) {
                        iconeUsuarioPadrao.remove();
                    }
                    const avatarImg = document.createElement("img");
                    avatarImg.id = "avatarDinamicoInput";
                    avatarImg.src = usuarioSelecionadoParaLogin.fotoPerfil || AVATAR_PADRAO;
                    avatarImg.alt = "Avatar";
                    avatarImg.style.width = "34px";
                    avatarImg.style.height = "34px";
                    avatarImg.style.borderRadius = "50%";
                    avatarImg.style.objectFit = "cover";
                    avatarImg.style.border = "1.5px solid var(--primary)";
                    avatarImg.style.flexShrink = "0";
                    avatarImg.style.background = "var(--surface-2)";
                    wrapperInputUsuario.prepend(avatarImg);

                    const primeiroNome = usuarioSelecionadoParaLogin.nome.split(' ')[0];
                    if (loginEyebrowText) loginEyebrowText.textContent = "AUTENTICAÇÃO";
                    if (loginTitleText) loginTitleText.textContent = `Bem-vindo, ${primeiroNome}!`;
                    
                    if (loginSubtitleText) {
                        loginSubtitleText.innerHTML = `Digite a sua senha <br><button type="button" class="btn-voltar-usuario" onclick="voltarParaTrocarUsuario()">← Voltar / Trocar usuário</button>`;
                    }

                    if (cardPrimeiroAcesso) cardPrimeiroAcesso.style.display = 'none';

                    blocoSenha.hidden = false;
                    blocoSenha.style.display = 'block';
                    if (botao) botao.classList.remove("loading");
                    if (spanTextoBotao) spanTextoBotao.textContent = "Entrar no Sistema";
                    if (setaBotao) setaBotao.style.display = "inline";
                    if (gifLoadingBotao) gifLoadingBotao.style.display = "none";
                    atualizarStatusLogin('Usuário localizado. Informe sua senha.', 'success');
                    
                    setTimeout(() => inputSenha.focus(), 50);
                    return;
                }

                // PASSO 2: VALIDAR A SENHA DE FORMA OTIMIZADA DIRETAMENTE NA NUVEM
                const senhaDigitada = inputSenha.value.trim();
                if (!senhaDigitada) {
                    await mostrarAlertaModal("Por favor, digite a sua senha.");
                    return;
                }

                if (botao) botao.classList.add("loading");
                if (spanTextoBotao) spanTextoBotao.textContent = "Validando senha...";
                if (setaBotao) setaBotao.style.display = "none";
                if (gifLoadingBotao) gifLoadingBotao.style.display = "inline-block";
                atualizarStatusLogin('Conferindo suas credenciais...', 'loading');

                const hashDigitado = await gerarHash(senhaDigitada);
                const resultadoAuth = await consultarLoginServidor({
                    usuario: usuarioSelecionadoParaLogin.usuario || usuarioSelecionadoParaLogin.nome,
                    senhaHash: hashDigitado
                });

                if (resultadoAuth.status !== 'sucesso' || !resultadoAuth.usuario?.id) {
                    atualizarStatusLogin(resultadoAuth.mensagem || 'Senha incorreta.', 'error');
                    await mostrarAlertaModal(resultadoAuth.mensagem || "Palavra-passe incorreta.");
                    inputSenha.value = '';
                    inputSenha.focus();
                    if (botao) botao.classList.remove("loading");
                    if (spanTextoBotao) spanTextoBotao.textContent = "Entrar no Sistema";
                    if (setaBotao) setaBotao.style.display = "inline";
                    if (gifLoadingBotao) gifLoadingBotao.style.display = "none";
                    return;
                }

                // Login confirmado: o progresso agora representa etapas reais.
                const telaCarregamento = document.getElementById("loginLoadingScreen");
                const avatarCarregamento = document.getElementById("loadingUserAvatar");
                const textoBoasVindas = document.getElementById("loadingWelcomeText");
                const subtextoCarregamento = document.getElementById("loadingSubtext");
                const barraPreenchimento = document.getElementById("loadingProgressBarFill");

                if (avatarCarregamento) {
                    avatarCarregamento.src = resultadoAuth.usuario.fotoPerfil || usuarioSelecionadoParaLogin.fotoPerfil || AVATAR_PADRAO;
                }
                if (textoBoasVindas) {
                    textoBoasVindas.textContent = `Olá, ${resultadoAuth.usuario.nome}!`;
                }
                if (telaCarregamento) {
                    telaCarregamento.classList.add("ativo");
                }
                if (barraPreenchimento) barraPreenchimento.classList.add('indeterminado');
                if (subtextoCarregamento) subtextoCarregamento.textContent = 'Sincronizando seus dados...';
                atualizarStatusLogin('Carregando informações da conta...', 'loading');

                await inicializarBanco();
                const dadosCarregados = obterDados();
                if (!dadosCarregados.usuarios.some(u => String(u.id) === String(resultadoAuth.usuario.id) && u.ativo !== false)) {
                    throw new Error('A conta autenticada não foi encontrada nos dados carregados.');
                }
                // A sessão só é gravada após os dados essenciais estarem disponíveis.
                localStorage.setItem('usuarioLogado', String(resultadoAuth.usuario.id));
                localStorage.setItem('privacidadeAtiva', 'true');
                if (barraPreenchimento) {
                    barraPreenchimento.classList.remove('indeterminado');
                    barraPreenchimento.style.width = '100%';
                }
                if (subtextoCarregamento) {
                    subtextoCarregamento.textContent = window.ultimaOrigemBanco === 'local-pendente'
                        ? 'Alterações locais pendentes de sincronização.'
                        : window.ultimaOrigemBanco === 'local-offline'
                            ? 'Dados locais disponíveis; servidor temporariamente indisponível.'
                            : 'Tudo pronto! Abrindo seu painel...';
                }
                atualizarStatusLogin('Conta pronta. Abrindo o painel...', 'success');
                if (window.ultimaOrigemBanco === 'local-offline') {
                    telaCarregamento?.classList.remove('ativo');
                    await mostrarAlertaModal('A autenticação funcionou, mas a atualização dos dados falhou. Você entrará com os dados locais, que podem estar desatualizados.');
                }
                window.location.href = 'dashboard.html';
                return true;

            } catch (erro) {
                console.error("Erro no processo de login:", erro);
                const telaCarregamento = document.getElementById("loginLoadingScreen");
                if (telaCarregamento) telaCarregamento.classList.remove("ativo");
                if (botao) botao.classList.remove("loading");
                if (spanTextoBotao) spanTextoBotao.textContent = usuarioSelecionadoParaLogin ? "Entrar no Sistema" : "Continuar";
                if (setaBotao) setaBotao.style.display = "inline";
                if (gifLoadingBotao) gifLoadingBotao.style.display = "none";
                localStorage.removeItem('usuarioLogado');
                atualizarStatusLogin(erro.name === 'AbortError' ? 'Tempo de conexão esgotado. Tente novamente.' : 'Não foi possível concluir o acesso. Verifique a conexão e tente novamente.', 'error');
                await mostrarAlertaModal(erro.message || 'Não foi possível concluir o acesso.');
            } finally {
                loginOcupado = false;
                if (botao) botao.disabled = !bancoInicializado;
            }
        }

        function voltarParaTrocarUsuario() {
            usuarioSelecionadoParaLogin = null;
            
            const inputUsuario = document.getElementById("inputUsuario");
            const inputSenha = document.getElementById("inputSenha");
            const blocoSenha = document.getElementById("blocoSenha");
            const textoBotao = document.querySelector(".login-submit-text");
            const spanTextoBotao = document.querySelector(".login-submit-text span:first-child") || textoBotao;
            const setaBotao = document.getElementById("loginSubmitArrow");
            const gifLoadingBotao = document.getElementById("loginSubmitLoadingGif");
            const wrapperInputUsuario = document.getElementById("wrapperInputUsuario");
            const avatarDinamicoInput = document.getElementById("avatarDinamicoInput");
            const loginEyebrowText = document.getElementById("loginEyebrowText");
            const loginTitleText = document.getElementById("loginTitleText");
            const loginSubtitleText = document.getElementById("loginSubtitleText");
            const cardPrimeiroAcesso = document.getElementById("cardPrimeiroAcesso");

            inputUsuario.readOnly = false;
            inputUsuario.style.opacity = '1';
            inputUsuario.value = '';

            if (avatarDinamicoInput) {
                avatarDinamicoInput.remove();
            }
            if (!document.getElementById("iconeUsuarioPadrao")) {
                const iconePadrao = document.createElement("span");
                iconePadrao.id = "iconeUsuarioPadrao";
                iconePadrao.className = "login-field-icon";
                iconePadrao.textContent = "👤";
                wrapperInputUsuario.prepend(iconePadrao);
            }

            blocoSenha.style.display = 'none';
            blocoSenha.hidden = true;
            inputSenha.value = '';

            if (spanTextoBotao) spanTextoBotao.textContent = "Continuar";
            if (setaBotao) setaBotao.style.display = "inline";
            if (gifLoadingBotao) gifLoadingBotao.style.display = "none";
            if (loginEyebrowText) loginEyebrowText.textContent = "SEU ESPAÇO FINANCEIRO";
            if (loginTitleText) loginTitleText.textContent = "Vamos entrar?";
            if (loginSubtitleText) loginSubtitleText.textContent = "Informe seu usuário para continuar.";
            if (cardPrimeiroAcesso) cardPrimeiroAcesso.style.display = 'flex';

            atualizarStatusLogin(bancoInicializado ? 'Servidor conectado. Pronto para entrar.' : 'Sem conexão com o servidor.', bancoInicializado ? 'success' : 'error');

            inputUsuario.focus();
        }

        function atualizarIconeTemaLogin() {
            const img = document.getElementById("themeImage");
            if (!img) return;
            img.src = "imagens/modo_escuro.jpg";
        }

        document.addEventListener("DOMContentLoaded", () => {
            atualizarIconeTemaLogin();
        });

        const alternarTemaOriginal = window.alternarTemaVisual;
        window.alternarTemaVisual = function (event) {
            if (typeof alternarTemaOriginal === "function") {
                alternarTemaOriginal(event);
            }
            requestAnimationFrame(() => {
                atualizarIconeTemaLogin();
            });
        };
    </script>
